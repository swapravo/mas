<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collections Agent Test Bench</title>
<style>
:root{
  --navy:#16264C; --navy2:#24386E; --ink:#1E293B; --paper:#F2F5FA; --card:#fff; --amber:#D98E04; --teal:#1F6F7D;
  --slate:#5B6B8C; --line:#DCE3EF; --red:#C0392B; --green:#2E8B57;
  --amber-tint:#FDF3DC; --teal-tint:#E4F1F3; --green-tint:#E5F4EC; --red-tint:#FBE9E7;
  --body:"Source Sans 3",Calibri,system-ui,-apple-system,sans-serif; --mono:ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:600}
header .sub{color:#B8C4DE;font-size:14px}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 14px;border-radius:9px;font-weight:600}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1b1300}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.no{color:var(--red)}
.btn.ghost{background:transparent;color:#fff;border-color:#4a5d8c}
.btn.sm{padding:4px 10px;font-size:14px}
#err{display:none;margin:12px 20px 0;background:var(--red-tint);border:1px solid #f1c4be;color:#9b2c20;padding:10px 14px;border-radius:10px}
main{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:18px;padding:18px 20px 40px;max-width:1280px;margin:0 auto}
@media(max-width:940px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.col{display:grid;gap:14px;align-content:start}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--paper);border:1px solid var(--line);color:var(--navy)}
.chip.ok{background:var(--green-tint);border-color:#bfe3cf;color:#1d6b40}
.chip.no{background:var(--red-tint);border-color:#f1c4be;color:#9b2c20}
.chip.warn{background:var(--amber-tint);border-color:#f0d9a2;color:#8a5a00}
.chip.info{background:var(--teal-tint);border-color:#b9dbe1;color:#17525d}
.muted{color:var(--slate)}
.mono{font-family:var(--mono);font-size:12.5px}
/* phone */
.phone{background:#0F1B3A;border-radius:28px;padding:10px;position:sticky;top:12px}
.screen{background:#E9EEF6;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;height:min(640px,calc(100vh - 60px))}
.chat-h{background:var(--navy2);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--amber);display:grid;place-items:center;font-weight:700;color:#fff}
.chat-h small{display:block;color:#C8D3EA;font-size:12px}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:8px 11px;border-radius:12px;font-size:15px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-wrap;overflow-wrap:anywhere}
.bub time{display:block;text-align:right;font-size:11px;color:var(--slate);margin-top:2px}
.bub.agent{background:#fff;align-self:flex-start;border-top-left-radius:3px}
.bub.me{background:#D3EEDD;align-self:flex-end;border-top-right-radius:3px}
.empty{color:var(--slate);font-size:14px;text-align:center;margin:auto}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;background:#F5F7FB;border-top:1px solid var(--line)}
.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--navy)}
.compose{display:flex;gap:8px;padding:10px;background:#F5F7FB}
.compose input{flex:1;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font:inherit;min-width:0}
/* case */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--slate)}.kv dd{margin:0;font-weight:600}
.pips{display:inline-flex;gap:5px;vertical-align:middle}
.pips i{width:24px;height:8px;border-radius:99px;background:var(--line)}
.pips i.on{background:var(--amber)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clock{font-family:var(--mono);font-size:14px;background:var(--paper);border:1px solid var(--line);padding:3px 10px;border-radius:8px}
/* drafts */
.draft{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.draft.pending{border:2px solid var(--amber);background:var(--amber-tint)}
.draft blockquote{margin:6px 0 10px;background:#fff;border:1px solid #f0d9a2;border-radius:8px;padding:8px 10px}
.draft.pending blockquote{border-color:#f0d9a2}
/* trace */
.step{border-left:4px solid var(--line);padding:6px 0 6px 12px;margin-top:8px}
.step.ok{border-left-color:var(--green)}.step.bad{border-left-color:var(--red)}
.step b{color:var(--navy)}
pre{margin:6px 0 0;background:#0F1B3A;color:#E6ECFA;border-radius:8px;padding:8px 10px;overflow-x:auto;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--slate);font-size:14px;margin-top:6px}
.audit{max-height:260px;overflow-y:auto}
.audit div{display:grid;grid-template-columns:62px 62px 1fr;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px solid #EEF2F8;align-items:baseline}
footer{max-width:1280px;margin:0 auto;padding:0 20px 24px;color:var(--slate);font-size:13px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
  <h1>Collections Agent Test Bench</h1>
  <span class="sub">You are the resident. Fake data only.</span>
  <span class="sp"></span>
  <button class="btn ghost" id="reset">Reset demo</button>
</header>
<div id="err" role="alert"></div>
<main>
  <div class="phone"><div class="screen">
    <div class="chat-h"><div class="avatar">C</div><div><b>Collections</b><small>housing operator assistant</small></div></div>
    <div id="msgs"></div>
    <div class="quick" id="quick"></div>
    <form class="compose" id="form">
      <input id="text" autocomplete="off" maxlength="500" placeholder="Reply as the resident" aria-label="Message">
      <button class="btn primary" id="send" type="submit">Send</button>
    </form>
  </div></div>

  <div class="col">
    <div class="card">
      <h2>Case</h2>
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <span id="status" class="chip"></span><span class="clock" id="clock"></span>
      </div>
      <dl class="kv" id="kv"></dl>
      <div class="row" style="margin-top:12px">
        <span class="muted">Simulated clock:</span>
        <button class="btn sm" data-adv="1">+1 hour</button>
        <button class="btn sm" data-adv="24">+1 day</button>
        <button class="btn sm" id="night">Jump to 23:30</button>
        <button class="btn sm" id="clockreset">Real time</button>
      </div>
    </div>

    <div class="card">
      <h2>Agent</h2>
      <div class="row">
        <button class="btn primary" id="run">Run agent</button>
        <label class="row" style="gap:6px"><input type="checkbox" id="auto" checked> Run after each message</label>
        <span class="muted" id="runinfo"></span>
      </div>
      <div id="trace"></div>
    </div>

    <div class="card">
      <h2>Approval queue</h2>
      <div id="drafts"></div>
    </div>

    <div class="card">
      <h2>Audit log (append only)</h2>
      <div class="audit" id="audit"></div>
    </div>
  </div>
</main>
<footer><span>Mindgraph AI · mgraph.dev</span><span>Local only. No login.</span></footer>
<script src="/static/main.js"></script>
</body>
</html>
